<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload & Display Gambar - Backend9</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .upload-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 2px dashed #667eea;
        }
        .upload-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-group input[type="file"] {
            padding: 10px;
            border: none;
            background: white;
        }
        .preview-container {
            margin: 15px 0;
            text-align: center;
        }
        #imagePreview {
            max-width: 150px;
            max-height: 150px;
            border-radius: 50%;
            display: none;
            border: 3px solid #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-success {
            background: #48bb78;
            color: white;
        }
        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }
        .btn-danger {
            background: #f56565;
            color: white;
        }
        .btn-danger:hover {
            background: #e53e3e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 101, 101, 0.4);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .user-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            transition: all 0.3s;
        }
        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 3px solid #667eea;
        }
        .user-avatar-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
        }
        .user-name {
            font-weight: 600;
            color: #333;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .user-email {
            color: #666;
            font-size: 12px;
            word-break: break-all;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .alert {
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
        }
        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            display: block;
        }
        .alert-error {
            background: #fed7d7;
            color: #9b2c2c;
            display: block;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            background: #48bb78;
            color: white;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Upload & Display Gambar</h1>
        <p class="subtitle">Backend9 × Supabase Storage</p>

        <!-- Alert Messages -->
        <div id="alert" class="alert"></div>

        <!-- Upload Section -->
        <div class="upload-section">
            <h2>📤 Upload Avatar</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Masukkan email" required>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Nama lengkap">
            </div>
            <div class="form-group">
                <label>Pilih Gambar</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>
            <div class="preview-container">
                <img id="imagePreview" alt="Preview">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="uploadUser()">📤 Upload & Simpan</button>
                <button class="btn btn-success" onclick="loadUsers()">🔄 Refresh Data</button>
            </div>
        </div>

        <!-- Users List -->
        <div style="margin-top: 20px;">
            <h2>👥 Daftar Users</h2>
            <div id="usersContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Memuat data...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://backend9.vercel.app/api';
        
        // Load users on page load
        window.onload = function() {
            loadUsers();
        };

        // Preview image
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.style.display = 'inline-block';
                };
                reader.readAsDataURL(file);
            }
        });

        async function loadUsers() {
            const container = document.getElementById('usersContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Memuat data...</p></div>';

            try {
                const response = await fetch(`${API_URL}/users`);
                if (!response.ok) throw new Error('Failed to load users');
                
                const users = await response.json();
                
                if (users.length === 0) {
                    container.innerHTML = '<p style="text-align:center;color:#666;">Belum ada user. Upload dulu yuk! 🚀</p>';
                    return;
                }

                container.innerHTML = `
                    <div class="users-grid">
                        ${users.map(user => `
                            <div class="user-card">
                                ${user.avatar_url ? 
                                    `<img src="${user.avatar_url}" alt="${user.full_name}" class="user-avatar">` :
                                    `<div class="user-avatar-placeholder">${user.full_name?.charAt(0) || '?'}</div>`
                                }
                                <div class="user-name">${user.full_name || user.username}</div>
                                <div class="user-email">${user.email}</div>
                                <div class="badge">${user.status || 'active'}</div>
                                ${user.avatar_url ? '' : '<div style="font-size:11px;color:#999;margin-top:5px;">No avatar</div>'}
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-error">
                        ❌ Gagal memuat data: ${error.message}
                    </div>
                `;
                showAlert('Error: ' + error.message, 'error');
            }
        }

        async function uploadUser() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            const imageFile = document.getElementById('imageInput').files[0];

            // Validasi
            if (!username || !email) {
                showAlert('Username dan Email wajib diisi!', 'error');
                return;
            }

            try {
                showAlert('⏳ Uploading...', 'success');
                
                let avatarUrl = '';
                
                // Upload gambar jika ada
                if (imageFile) {
                    const reader = new FileReader();
                    const imageData = await new Promise((resolve) => {
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(imageFile);
                    });

                    const uploadResponse = await fetch(`${API_URL}/upload`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image: imageData,
                            filename: imageFile.name
                        })
                    });

                    if (!uploadResponse.ok) {
                        const errorData = await uploadResponse.json();
                        throw new Error(errorData.error || 'Upload gambar gagal');
                    }

                    const uploadResult = await uploadResponse.json();
                    avatarUrl = uploadResult.url;
                }

                // Simpan user
                const userData = {
                    username,
                    email,
                    full_name: fullName || username,
                    avatar_url: avatarUrl
                };

                const userResponse = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (!userResponse.ok) {
                    const errorData = await userResponse.json();
                    throw new Error(errorData.error || 'Gagal menyimpan user');
                }

                const userResult = await userResponse.json();
                showAlert(`✅ User "${username}" berhasil disimpan!`, 'success');
                
                // Reset form
                document.getElementById('username').value = '';
                document.getElementById('email').value = '';
                document.getElementById('fullName').value = '';
                document.getElementById('imageInput').value = '';
                document.getElementById('imagePreview').style.display = 'none';
                
                // Reload users
                loadUsers();
                
            } catch (error) {
                showAlert('❌ Error: ' + error.message, 'error');
                console.error('Upload error:', error);
            }
        }

        function showAlert(message, type) {
            const alertEl = document.getElementById('alert');
            alertEl.textContent = message;
            alertEl.className = 'alert alert-' + type;
            
            // Auto hide after 5 seconds
            clearTimeout(window.alertTimeout);
            window.alertTimeout = setTimeout(() => {
                alertEl.className = 'alert';
                alertEl.textContent = '';
            }, 5000);
        }

        // Keyboard shortcut: Enter untuk upload
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.target.closest('.form-group')) {
                uploadUser();
            }
        });
    </script>
</body>
</html>
