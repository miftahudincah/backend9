<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>⚡ Upload & Render · Dark Mode</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 820px;
            width: 100%;
            background: #161b22;
            border-radius: 2rem;
            padding: 2rem 2rem 2.2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 0 1px #30363d inset;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.2rem;
        }
        .sub {
            color: #8b949e;
            margin-bottom: 2rem;
            padding-left: 1rem;
            border-left: 3px solid #2d82ff;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #3fb950;
            border-radius: 50%;
            margin-right: 4px;
        }
        .badge {
            background: #21262d;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #8b949e;
            border: 1px solid #30363d;
        }
        .upload-area {
            border: 2px dashed #30363d;
            border-radius: 1.8rem;
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
            background: #0d1117;
            margin-bottom: 1.5rem;
        }
        .upload-area:hover { border-color: #58a6ff; background: #0f141e; }
        .upload-area.dragover { border-color: #58a6ff; background: #1c2333; }
        .upload-area input { display: none; }
        .upload-area .icon { font-size: 2.8rem; margin-bottom: 0.3rem; }
        .upload-area .text { color: #8b949e; font-size: 0.95rem; }
        .btn-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin: 1.2rem 0 1.5rem;
        }
        .btn {
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: 2.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            background: #21262d;
            color: #c9d1d9;
            cursor: pointer;
            border: 1px solid #30363d;
            transition: 0.1s;
            flex: 1 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary {
            background: #1f6feb;
            border-color: #1f6feb;
            color: white;
        }
        .btn-primary:hover { background: #388bfd; transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-outline { background: transparent; border-color: #30363d; }
        .btn-outline:hover { background: #21262d; }
        .response-box {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 1.5rem;
            padding: 1rem 1.3rem;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-word;
            color: #c9d1d9;
            max-height: 200px;
            overflow: auto;
            margin-top: 1rem;
            line-height: 1.5;
        }
        .response-box .label {
            color: #8b949e;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-family: system-ui;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.8rem;
            margin-top: 1.8rem;
        }
        .gallery-item {
            background: #0d1117;
            border-radius: 1.2rem;
            border: 1px solid #21262d;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            position: relative;
        }
        .gallery-item:hover { border-color: #30363d; }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .gallery-item .file-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: #e6edf3;
            font-size: 0.6rem;
            padding: 0.2rem 0.5rem;
            text-align: center;
            opacity: 0;
            transition: 0.1s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gallery-item:hover .file-name { opacity: 1; }
        .gallery-empty {
            color: #8b949e;
            text-align: center;
            padding: 3rem 0;
            font-size: 0.95rem;
            grid-column: 1 / -1;
        }
        .footer {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            color: #484f58;
            font-size: 0.75rem;
            border-top: 1px solid #21262d;
            padding-top: 1.2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }
        @media (max-width: 540px) {
            .card { padding: 1.5rem; }
            h1 { font-size: 1.4rem; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .btn { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📸 Upload &amp; Render</h1>
    <div class="sub">
        <span><span class="status-dot"></span> Supabase Storage</span>
        <span class="badge" id="bucketName">user_uploads</span>
        <span class="badge" id="statusText">● online</span>
    </div>

    <div class="upload-area" id="uploadArea">
        <div class="icon">🖼️</div>
        <div class="text" id="uploadText">Klik atau seret gambar ke sini</div>
        <input type="file" id="fileInput" accept="image/*" multiple />
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" id="uploadBtn">⬆ Upload</button>
        <button class="btn btn-outline" id="refreshBtn">⟳ Refresh</button>
        <button class="btn btn-outline" id="clearBtn">✕ Clear</button>
    </div>

    <div class="response-box" id="responseBox">
        <div class="label">📡 response</div>
        <span style="color:#484f58;">← siap upload</span>
    </div>

    <div id="galleryContainer">
        <div class="gallery" id="gallery"></div>
    </div>

    <div class="footer">
        <span>⚡ backend9.vercel.app</span>
        <span id="fileCount">0 file</span>
    </div>
</div>

<script>
    (function() {
        // ===== KONFIGURASI =====
        const SUPABASE_URL = 'https://spwlyrrgowitiacgxjni.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_B0GDNWvGNbF98hWcsBKmUg_HADtmbH5';
        const BUCKET_NAME = 'user_uploads';

        // ===== DOM =====
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const clearBtn = document.getElementById('clearBtn');
        const responseBox = document.getElementById('responseBox');
        const gallery = document.getElementById('gallery');
        const fileCount = document.getElementById('fileCount');
        const uploadText = document.getElementById('uploadText');
        const statusText = document.getElementById('statusText');

        let selectedFiles = [];

        // ===== HELPERS =====
        function setResponse(data, isError = false) {
            const label = responseBox.querySelector('.label');
            const text = isError
                ? '❌ ' + (data?.message || data?.error || JSON.stringify(data) || 'error')
                : (typeof data === 'string' ? data : JSON.stringify(data, null, 2));
            responseBox.innerHTML = '';
            if (label) responseBox.appendChild(label);
            const pre = document.createElement('pre');
            pre.style.margin = '0';
            pre.style.whiteSpace = 'pre-wrap';
            pre.style.wordBreak = 'break-word';
            pre.textContent = text;
            responseBox.appendChild(pre);
        }

        function updateFileCount() {
            const items = gallery.querySelectorAll('.gallery-item');
            fileCount.textContent = items.length + ' file' + (items.length !== 1 ? 's' : '');
        }

        function setStatus(online) {
            statusText.textContent = online ? '● online' : '○ offline';
            statusText.style.color = online ? '#3fb950' : '#da3633';
        }

        // ===== RENDER GALLERY =====
        function renderGallery(files) {
            gallery.innerHTML = '';
            if (!files || files.length === 0) {
                gallery.innerHTML = '<div class="gallery-empty">📭 Belum ada gambar</div>';
                updateFileCount();
                return;
            }

            files.forEach(fileName => {
                if (!fileName) return;
                const url = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${encodeURIComponent(fileName)}`;
                const item = document.createElement('div');
                item.className = 'gallery-item';

                const img = document.createElement('img');
                img.src = url;
                img.alt = fileName;
                img.loading = 'lazy';
                img.onerror = function() {
                    this.style.display = 'none';
                    const fallback = document.createElement('span');
                    fallback.textContent = '⚠️';
                    fallback.style.color = '#484f58';
                    fallback.style.fontSize = '2rem';
                    this.parentNode.appendChild(fallback);
                };
                item.appendChild(img);

                const label = document.createElement('div');
                label.className = 'file-name';
                label.textContent = fileName;
                item.appendChild(label);

                gallery.appendChild(item);
            });
            updateFileCount();
        }

        // ===== FETCH LIST FILES (VERSI PUBLIC) =====
        async function fetchFiles() {
            try {
                setStatus(true);
                const res = await fetch(`${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                    }
                });

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                }

                const data = await res.json();
                if (!Array.isArray(data)) {
                    throw new Error('Response bukan array');
                }

                const names = data
                    .map(item => item.name)
                    .filter(name => name && typeof name === 'string');

                if (names.length === 0) {
                    renderGallery([]);
                    setResponse({ message: '📭 Belum ada file di bucket' });
                } else {
                    renderGallery(names);
                    setResponse({ success: true, total: names.length, files: names });
                }
            } catch (e) {
                console.error('Fetch error:', e);
                setStatus(false);
                setResponse({
                    error: 'Gagal ambil daftar file',
                    detail: e.message,
                    saran: 'Coba upload file dulu, lalu Refresh'
                }, true);
                renderGallery([]);
            }
        }

        // ===== UPLOAD FILES =====
        async function uploadFiles() {
            if (!selectedFiles.length) {
                setResponse({ error: 'Pilih gambar dulu!' }, true);
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.textContent = '⏳ Uploading...';
            setStatus(true);

            const results = [];
            let hasError = false;

            for (const file of selectedFiles) {
                try {
                    const timestamp = Date.now();
                    const ext = file.name.split('.').pop() || 'jpg';
                    const fileName = `upload_${timestamp}_${Math.random().toString(36).substring(2, 8)}.${ext}`;

                    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET_NAME}/${fileName}`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY,
                            'Content-Type': file.type,
                        },
                        body: file,
                    });

                    if (!res.ok) {
                        const err = await res.text();
                        results.push({ file: file.name, error: err });
                        hasError = true;
                    } else {
                        const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${fileName}`;
                        results.push({ file: file.name, success: true, url: publicUrl, fileName });
                    }
                } catch (e) {
                    results.push({ file: file.name, error: e.message });
                    hasError = true;
                }
            }

            uploadBtn.disabled = false;
            uploadBtn.textContent = '⬆ Upload';

            if (hasError) {
                setResponse(results, true);
            } else {
                setResponse(results);
            }

            await fetchFiles();
            fileInput.value = '';
            selectedFiles = [];
            uploadText.textContent = 'Klik atau seret gambar ke sini';
        }

        // ===== CLEAR =====
        function clearGallery() {
            gallery.innerHTML = '<div class="gallery-empty">📭 Belum ada gambar</div>';
            updateFileCount();
            setResponse({ message: 'Tampilan dibersihkan (file di storage tetap ada)' });
        }

        // ===== EVENT LISTENERS =====
        fileInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length) {
                selectedFiles = files;
                const names = files.map(f => f.name).join(', ');
                uploadText.textContent = `📎 ${files.length} file: ${names}`;
            } else {
                selectedFiles = [];
                uploadText.textContent = 'Klik atau seret gambar ke sini';
            }
        });

        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            if (files.length) {
                selectedFiles = files;
                const names = files.map(f => f.name).join(', ');
                uploadText.textContent = `📎 ${files.length} file: ${names}`;
                fileInput.files = e.dataTransfer.files;
            } else {
                setResponse({ error: 'Hanya file gambar yang didukung' }, true);
            }
        });

        uploadArea.addEventListener('click', function() {
            fileInput.click();
        });

        uploadBtn.addEventListener('click', uploadFiles);
        refreshBtn.addEventListener('click', fetchFiles);
        clearBtn.addEventListener('click', clearGallery);

        // ===== INIT =====
        fetchFiles();
        setResponse({ message: '🚀 Siap upload! Pilih gambar lalu klik Upload.' });
        updateFileCount();
        setStatus(true);
    })();
</script>
</body>
</html>
